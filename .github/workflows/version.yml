name: Version

# Runs on every push to main. Changesets opens/updates a "Version Packages" PR
# that, when merged, bumps the shared version (desktop app, VS Code extension and
# the callimachus-mcp npm wrapper move together), syncs tauri.conf.json,
# Cargo.toml, Cargo.lock and server.json, and pushes a vX.Y.Z (or vX.Y.Z-rc.N in
# prerelease mode) tag. That tag triggers build.yml (installers, binaries, npm +
# MCP registry) and publish-extension.yml (the extension).

on:
  push:
    branches: [main]

concurrency:
  group: version-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # RELEASE_TOKEN (a PAT) is required so the pushed tag triggers build.yml.
          # The default GITHUB_TOKEN cannot trigger another workflow. Falls back
          # to GITHUB_TOKEN (Version PR still works; the tag just won't auto-build).
          token: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create Version PR / tag release
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version-script: pnpm run version-packages
          publish-script: pnpm run release:tag
          commit-message: "chore: version packages"
          pr-title: "chore: version packages"
          # v2 takes a custom token only through this input (a GITHUB_TOKEN env
          # var that differs from it fails the step). Same PAT as the checkout, so
          # the Version PR's pushes trigger CI.
          github-token: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          # Commit and push the Version PR with git, as v1 did. v2's default
          # GitHub API push rejects any changed file with the executable bit.
          push-with-git-cli: true
          # release-tag.mjs pushes the one v<ver> tag itself and build.yml owns
          # the GitHub Release (as a draft until every asset is up), so the
          # action must create neither.
          create-github-releases: false
          push-git-tags: false
