name: Build & Release

# Triggered by the vX.Y.Z (or -rc.N) tag pushed by version.yml, or run manually.
# Builds the desktop app for macOS (Apple Silicon), Windows (x64) and Linux (x64),
# signs the installers and updater artifacts, and publishes them to one GitHub
# Release. RC/beta tags are marked prereleases.
#
# Release ordering: create-release opens a DRAFT release first, every platform
# uploads into that draft, and finalize publishes it only after every leg
# succeeded and latest.json covers every platform. Until then nothing is public,
# so the auto-updater (releases/latest/download/latest.json) never sees a
# half-uploaded release, and a failed leg leaves a draft instead of a broken
# "Latest". publish-extension.yml attaches the .vsix to the same draft.
#
# Re-running a tag whose release is already PUBLISHED never rebuilds or
# re-uploads anything: codesigned builds are not byte-reproducible, so fresh
# binaries would stop matching the SHA256SUMS already bundled into the
# published callimachus-mcp npm package (every `npx` download would then fail
# its checksum), and tauri-action would swap live installers out from under
# latest.json. Such a re-run skips the build legs, leaves the release alone and
# only retries publish-mcp (npm publish is skipped when the version exists).
#
# macOS is Apple Silicon only: `ort` (fastembed's ONNX backend, currently pinned
# via fastembed to ort 2.0.0-rc.12) publishes NO x86_64-apple-darwin prebuilt at
# all (not even on a native Intel runner), and fastembed force-enables
# `download-binaries`, so there's no config knob to point it elsewhere. Supporting
# Intel would require a system/dynamic ONNX Runtime + bundling its dylib; not worth
# it for the shrinking Intel-Mac base. Linux runs on 24.04 because the ONNX prebuilt
# needs glibc >= 2.38 (22.04 ships 2.35 -> undefined __isoc23_* link errors), so the
# Linux binaries need glibc 2.38+ at run time too.
#
# Third-party actions are pinned to commit SHAs (Dependabot keeps them current):
# these jobs hold the updater signing key and the Apple/Azure signing credentials.

on:
  push:
    tags: ["v[0-9]*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build (e.g. v0.2.0)"
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ inputs.tag || github.ref_name }}
  # Keep RUST_TOOLCHAIN and CARGO_INCREMENTAL identical to release-cache.yml: both
  # feed rust-cache's key, and that workflow is what warms the cache restored here.
  RUST_TOOLCHAIN: "1.96.0"
  CARGO_INCREMENTAL: 0

jobs:
  create-release:
    name: Create draft release
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.release.outputs.id }}
      # "true" when the tag's release is already public (a re-run): the build
      # legs are skipped and finalize only verifies (see the header).
      published: ${{ steps.release.outputs.published }}
      changelog: ${{ steps.notes.outputs.changelog }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}

      # The release body is this version's section of the desktop CHANGELOG plus an
      # install footer. latest.json's `notes` (what an update prompt can show) gets
      # the changelog section alone.
      - name: Release notes from the changelog
        id: notes
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          NOTES="$(awk -v heading="## $VERSION" '
            $0 == heading { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' apps/desktop/CHANGELOG.md | sed '/./,$!d')"
          if [ -z "$NOTES" ]; then
            NOTES="See the assets below to download and install this version."
          fi
          {
            echo "changelog<<__CALLIMACHUS_NOTES__"
            printf '%s\n' "$NOTES"
            echo "__CALLIMACHUS_NOTES__"
          } >> "$GITHUB_OUTPUT"
          # shellcheck disable=SC2016 # literal Markdown backticks, not expansions
          FOOTER='**Install:** macOS `.dmg` (Apple Silicon), Windows `.msi` or `-setup.exe`, Linux `.AppImage`, `.deb` or `.rpm` (glibc 2.38+). Installed apps update themselves. The standalone `cal-<target>` and `callimachus-mcp-<target>` binaries are for CLI/MCP-only use; their SHA-256 sums are in `SHA256SUMS`.'
          printf '%s\n\n---\n%s\n' "$NOTES" "$FOOTER" > "$RUNNER_TEMP/notes.md"

      - name: Create (or reuse) the draft release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ contains(env.TAG, '-rc') || contains(env.TAG, '-beta') }}
        run: |
          set -euo pipefail
          # Drafts are invisible to `releases/tags/<tag>`, so look the tag up in the
          # full list. Reusing an existing draft makes re-running a failed leg safe.
          # The list is served from read replicas and lags a freshly created draft
          # by a few seconds (v0.11.1 failed on exactly that), so the lookup takes a
          # number of attempts. `|| true` keeps a SIGPIPE from `head` from tripping
          # pipefail. Prints "<id> <draft>", e.g. "123 true".
          find_release() {
            local attempts="$1" attempt rel
            for attempt in $(seq 1 "$attempts"); do
              rel="$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --paginate \
                --jq ".[] | select(.tag_name == \"$TAG\") | \"\\(.id) \\(.draft)\"" | head -n 1 || true)"
              if [ -n "$rel" ]; then echo "$rel"; return 0; fi
              if [ "$attempt" -lt "$attempts" ]; then sleep 3; fi
            done
            return 0
          }
          REL="$(find_release 2)"
          read -r ID DRAFT <<< "$REL"
          if [ -z "$ID" ]; then
            # Create through the API: the response carries the id, so there is no
            # list lookup to race against. The tag already exists (it triggered this
            # workflow), which is what `gh release create --verify-tag` checked.
            ID="$(gh api -X POST "repos/$GITHUB_REPOSITORY/releases" \
              -f tag_name="$TAG" -f name="Callimachus $TAG" \
              -F body="@$RUNNER_TEMP/notes.md" -F draft=true -F prerelease="$PRERELEASE" \
              --jq '.id')"
            DRAFT=true
            echo "Created draft release $ID for $TAG"
          fi
          if [ -z "$ID" ]; then
            # Last resort, e.g. the POST raced a draft that appeared meanwhile.
            REL="$(find_release 10)"
            read -r ID DRAFT <<< "$REL"
          fi
          if [ -z "$ID" ]; then
            echo "::error::Could not find or create a release for $TAG"
            exit 1
          fi
          PUBLISHED=false
          if [ "$DRAFT" != "true" ]; then
            PUBLISHED=true
            echo "::notice::$TAG is already published: skipping the build legs, nothing on the release is replaced"
          fi
          echo "Release $TAG has id $ID (published: $PUBLISHED)"
          {
            echo "id=$ID"
            echo "published=$PUBLISHED"
          } >> "$GITHUB_OUTPUT"

  release:
    needs: create-release
    # Never build into a published release (see the header): skipped legs leave
    # its installers, standalone bins and SHA256SUMS untouched.
    if: needs.create-release.outputs.published != 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest # Apple Silicon (native arm64)
            args: "--target aarch64-apple-darwin"
            rust_target: aarch64-apple-darwin
          - platform: ubuntu-24.04 # Linux x64 (glibc 2.39 for the ONNX prebuilt)
            args: ""
            rust_target: ""
          - platform: windows-latest # Windows x64
            args: ""
            rust_target: ""
    runs-on: ${{ matrix.platform }}
    env:
      # Booleans only: the secrets themselves are passed to the individual steps
      # that need them, never job-wide, so dependency install scripts (pnpm install
      # runs third-party lifecycle scripts) can't read signing material. The
      # tauri-action step does run third-party build code (the tauri CLI, vite and
      # its plugins, every crate's build.rs), so it gets only THIS leg's platform
      # credentials, gated on runner.os, plus the updater key every leg needs.
      # AppImage GPG signing (Linux). Unset -> AppImage built unsigned, no failure.
      HAS_LINUX_GPG: ${{ secrets.LINUX_GPG_PRIVATE_KEY != '' }}
      # Windows Authenticode via Azure Trusted Signing. Unset -> unsigned .exe/.msi.
      HAS_AZURE: ${{ secrets.AZURE_CLIENT_ID != '' }}
      # Apple Developer ID certificate. Unset -> the mac app and bins build unsigned.
      HAS_APPLE_CERT: ${{ secrets.APPLE_CERTIFICATE != '' }}
      # App Store Connect API key for notarization. Unset -> signed, not notarized.
      HAS_APPLE_API_KEY: ${{ secrets.APPLE_API_KEY != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}

      - name: Install Linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            build-essential pkg-config libssl-dev

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ matrix.rust_target }}

      # macOS: rustc links `-lclang_rt.osx` but searches a clang-version subdir the runner's
      # Xcode lacks; the lib is present under a different clang/<ver> dir. Add it to the search
      # path so the link resolves on macos-latest (see ci.yml for the full note).
      - name: Locate compiler-rt for the linker (macOS)
        if: runner.os == 'macOS'
        run: |
          LIB=$(find "$(xcode-select -p)" -name 'libclang_rt.osx.a' 2>/dev/null | head -1)
          if [ -n "$LIB" ]; then
            echo "RUSTFLAGS=${RUSTFLAGS:-} -L $(dirname "$LIB")" >> "$GITHUB_ENV"
            echo "compiler-rt: $LIB"
          else
            echo "::warning::libclang_rt.osx.a not found under $(xcode-select -p)"
          fi

      # Caches saved on a tag are scoped to that tag, so no later tag could ever
      # restore one: release runs only RESTORE, from the cache release-cache.yml
      # saves on main with the same shared key.
      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: ./apps/desktop/src-tauri -> target
          shared-key: release-${{ matrix.platform }}
          save-if: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Import AppImage signing key (Linux)
        if: runner.os == 'Linux' && env.HAS_LINUX_GPG == 'true'
        env:
          LINUX_GPG_PRIVATE_KEY: ${{ secrets.LINUX_GPG_PRIVATE_KEY }}
        run: echo "$LINUX_GPG_PRIVATE_KEY" | gpg --batch --import

      # Prebuilt, checksum-pinned artifact-signing-cli (compiling it from source cost
      # ~4 min per Windows release). Microsoft renamed Trusted Signing to Artifact
      # Signing; the old trusted-signing-cli 0.10.0 bundled dlib 1.0.128 from the
      # retired Microsoft.Trusted.Signing.Client package, and from v0.11.1 on the
      # service answered it with signtool's generic "unexpected internal error" even
      # with valid credentials. 0.12.0 ships dlib 1.0.146 from
      # Microsoft.ArtifactSigning.Client; the -e/-a/-c/-d flags are unchanged.
      - name: Install Artifact Signing CLI (Windows)
        if: runner.os == 'Windows' && env.HAS_AZURE == 'true'
        shell: bash
        env:
          ASC_VERSION: "0.12.0"
          ASC_SHA256: dd6fa95a0367cbd32ea520037c3df72d1ed8f523a5b07883b0c2a4034e918a53
        run: |
          set -euo pipefail
          DIR="$(cygpath -u "$RUNNER_TEMP")/artifact-signing-cli"
          mkdir -p "$DIR"
          curl -fsSL --retry 3 -o "$DIR/artifact-signing-cli.exe" \
            "https://github.com/Levminer/artifact-signing-cli/releases/download/$ASC_VERSION/artifact-signing-cli.exe"
          echo "$ASC_SHA256  $DIR/artifact-signing-cli.exe" | sha256sum -c -
          # The build job checks out the TAG's sources, so the signCommand it reads
          # (src-tauri/tauri.windows-sign.conf.json) can be older than this workflow.
          # v0.11.1's overlay still calls `trusted-signing-cli`, which made the
          # bundler fail with "program not found" after the rename. Provide both
          # names so any tag's overlay resolves to the same pinned binary.
          cp "$DIR/artifact-signing-cli.exe" "$DIR/trusted-signing-cli.exe"
          cygpath -w "$DIR" >> "$GITHUB_PATH"

      # Decode the App Store Connect API key (.p8) used for notarization. The base64
      # secret avoids storing a file; the path is handed to the Tauri bundler below
      # via APPLE_API_KEY_PATH, and reused to notarize the standalone binaries.
      - name: Write App Store Connect API key (macOS)
        if: runner.os == 'macOS' && env.HAS_APPLE_API_KEY == 'true'
        env:
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
        run: echo "$APPLE_API_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/apple_api_key.p8"

      # Standalone `cal` + `callimachus-mcp` binaries for CLI/MCP-only users (no GUI
      # app). They are the `callimachus-standalone` workspace member, not bins of the
      # app crate, because `tauri build` bundles every bin of the app crate: that put
      # two unused 27-29 MB copies of the backend into the macOS .app and the Linux
      # packages (the app binary already serves `cal` and `--mcp`). Built before the
      # app so the Windows leg can bundle them: Windows installs keep `cal.exe` (and
      # `callimachus-mcp.exe`) next to the app as sidecars, through the CI-only
      # src-tauri/tauri.windows-sidecars.conf.json overlay, which reads them from
      # src-tauri/binaries/. The app build afterwards reuses the compiled deps. Each
      # job uploads its own arch-suffixed names, so no collisions.
      - name: Build standalone cal + callimachus-mcp
        shell: bash
        working-directory: apps/desktop/src-tauri
        run: |
          set -euo pipefail
          # The lib embeds apps/desktop/dist at compile time and the frontend isn't
          # built until tauri-action runs; these bins never serve it, so empty is fine.
          mkdir -p ../dist
          # A dispatched older tag (sources from the tag, this workflow from main) still
          # has the two bins in the app crate, where the bundler picks them up itself.
          PKG=(-p callimachus-standalone)
          [ -f standalone/Cargo.toml ] || PKG=(--bin cal --bin callimachus-mcp)
          TARGET="${{ matrix.rust_target }}"
          if [ -n "$TARGET" ]; then
            cargo build --release --locked --target "$TARGET" "${PKG[@]}"
            OUT="target/$TARGET/release"
            TRIPLE="$TARGET"
          else
            cargo build --release --locked "${PKG[@]}"
            OUT="target/release"
            TRIPLE="$(rustc -vV | sed -n 's/host: //p')"
          fi
          EXT=""
          [ "${{ runner.os }}" = "Windows" ] && EXT=".exe"
          STAGE="$RUNNER_TEMP/cli-bins"
          mkdir -p "$STAGE"
          cp "$OUT/cal$EXT"             "$STAGE/cal-$TRIPLE$EXT"
          cp "$OUT/callimachus-mcp$EXT" "$STAGE/callimachus-mcp-$TRIPLE$EXT"
          if [ "${{ runner.os }}" = "Windows" ] && [ -f tauri.windows-sidecars.conf.json ]; then
            # bundle.externalBin names: <name>-<target triple>.exe, installed as <name>.exe.
            mkdir -p binaries
            cp "$OUT/cal$EXT"             "binaries/cal-$TRIPLE$EXT"
            cp "$OUT/callimachus-mcp$EXT" "binaries/callimachus-mcp-$TRIPLE$EXT"
          fi
          {
            echo "STAGE=$STAGE"
            echo "TRIPLE=$TRIPLE"
            echo "EXT=$EXT"
          } >> "$GITHUB_ENV"

      - name: Build, sign & upload to the draft release
        # Held at 0.6.x on purpose: 1.0 writes API asset URLs into latest.json, which
        # puts every auto-update download under GitHub's unauthenticated API rate
        # limit. See the tauri-action ignore in dependabot.yml.
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Opt-in desktop telemetry: baked in at compile time via option_env!, so only
          # official release builds can send anything (forks and local builds have no
          # token). Repo *variables*, not secrets: a PostHog project token is a
          # write-only ingestion key. Deliberately step-scoped: the standalone
          # cal/callimachus-mcp build above does not see it, and those never send
          # analytics.
          CALLIMACHUS_POSTHOG_TOKEN: ${{ vars.POSTHOG_PROJECT_TOKEN }}
          CALLIMACHUS_POSTHOG_HOST: ${{ vars.POSTHOG_HOST }}
          # Every platform credential below is gated on runner.os, so a compromised
          # build dependency on one leg can't read another platform's signing
          # material (`cond && secret || ''` yields an empty string elsewhere).
          #
          # AppImage GPG signing: Linux only, and only when the key secret exists
          # (otherwise SIGN is empty -> unsigned AppImage, no failure).
          SIGN: ${{ runner.os == 'Linux' && env.HAS_LINUX_GPG == 'true' && '1' || '' }}
          SIGN_KEY: ${{ runner.os == 'Linux' && secrets.LINUX_GPG_KEY_ID || '' }}
          APPIMAGETOOL_SIGN_PASSPHRASE: ${{ runner.os == 'Linux' && secrets.LINUX_GPG_PASSPHRASE || '' }}
          APPIMAGETOOL_FORCE_SIGN: ${{ runner.os == 'Linux' && env.HAS_LINUX_GPG == 'true' && '1' || '' }}
          # Azure Artifact Signing (formerly Trusted Signing) creds, read by artifact-signing-cli (the Windows
          # signCommand in src-tauri/tauri.windows-sign.conf.json). Windows only.
          AZURE_TENANT_ID: ${{ runner.os == 'Windows' && secrets.AZURE_TENANT_ID || '' }}
          AZURE_CLIENT_ID: ${{ runner.os == 'Windows' && secrets.AZURE_CLIENT_ID || '' }}
          AZURE_CLIENT_SECRET: ${{ runner.os == 'Windows' && secrets.AZURE_CLIENT_SECRET || '' }}
          # Apple Developer ID signing + notarization (macOS leg only). The Tauri
          # bundler decodes APPLE_CERTIFICATE into a temporary keychain itself. The
          # ONNX runtime is statically linked (ort download-binaries), so there's no
          # nested third-party dylib and no entitlements file is required. Hardened
          # runtime is on by default; with no App Sandbox it does not block the git/
          # osascript/CLI subprocesses the app spawns. Notarization + stapling run
          # via the App Store Connect API key (APPLE_API_KEY/ISSUER/KEY_PATH), far
          # more robust than an Apple ID + app-specific password, which locks the
          # account after repeated failed CI auths.
          APPLE_CERTIFICATE: ${{ runner.os == 'macOS' && secrets.APPLE_CERTIFICATE || '' }}
          APPLE_CERTIFICATE_PASSWORD: ${{ runner.os == 'macOS' && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
          APPLE_SIGNING_IDENTITY: ${{ runner.os == 'macOS' && secrets.APPLE_SIGNING_IDENTITY || '' }}
          APPLE_API_ISSUER: ${{ runner.os == 'macOS' && secrets.APPLE_API_ISSUER || '' }}
          APPLE_API_KEY: ${{ runner.os == 'macOS' && secrets.APPLE_API_KEY || '' }}
          APPLE_API_KEY_PATH: ${{ runner.temp }}/apple_api_key.p8
        with:
          projectPath: apps/desktop
          # Upload into the draft opened by create-release. tagName is still needed:
          # it rewrites the draft's "untagged-..." download URLs in latest.json to
          # the real /download/<tag>/ URLs that work once the release is published.
          releaseId: ${{ needs.create-release.outputs.release_id }}
          tagName: ${{ env.TAG }}
          releaseBody: ${{ needs.create-release.outputs.changelog }}
          # Each job appends its platform/arch entry to the release's latest.json.
          includeUpdaterJson: true
          # The Windows signCommand lives in a CI-only overlay so local and fork
          # builds without artifact-signing-cli don't fail at bundle time. So does
          # the Windows sidecar list (cal.exe, callimachus-mcp.exe): tauri-build
          # requires every externalBin file to exist, which would break plain
          # `cargo build` / `cargo check` on Windows. The bundler signs the
          # sidecars with the same signCommand. hashFiles: an older tag has no overlay.
          args: ${{ matrix.args }}${{ runner.os == 'Windows' && hashFiles('apps/desktop/src-tauri/tauri.windows-sidecars.conf.json') != '' && ' --config src-tauri/tauri.windows-sidecars.conf.json' || '' }}${{ runner.os == 'Windows' && env.HAS_AZURE == 'true' && ' --config src-tauri/tauri.windows-sign.conf.json' || '' }}

      # Authenticode-sign the staged Windows bins (matches the app's signCommand)
      # so they don't trip SmartScreen "Unknown publisher".
      - name: Sign standalone bins (Windows)
        if: runner.os == 'Windows' && env.HAS_AZURE == 'true'
        shell: bash
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          for f in "$STAGE/cal-$TRIPLE$EXT" "$STAGE/callimachus-mcp-$TRIPLE$EXT"; do
            artifact-signing-cli -e https://eus.codesigning.azure.net -a betabots -c callimachus -d Callimachus "$f"
          done

      # Developer ID-sign (hardened runtime + secure timestamp) and notarize the
      # bare Mach-O bins. Without this they carry only the linker's ad-hoc
      # signature and Gatekeeper rejects a browser-downloaded copy. Bare binaries
      # can't be stapled, so Gatekeeper checks the notarization ticket online.
      - name: Sign + notarize standalone bins (macOS)
        if: runner.os == 'macOS' && env.HAS_APPLE_CERT == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_PATH: ${{ runner.temp }}/apple_api_key.p8
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/cli-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
          CERT="$RUNNER_TEMP/cli-signing.p12"
          cleanup() {
            security delete-keychain "$KEYCHAIN" >/dev/null 2>&1 || true
            rm -f "$CERT"
          }
          trap cleanup EXIT

          # Import the Developer ID cert into a throwaway keychain (the Tauri bundler
          # deletes its own keychain when it finishes).
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$CERT"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$CERT" -k "$KEYCHAIN" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          # Prepend to the search list (keeping the defaults) so codesign can build the chain.
          # shellcheck disable=SC2046 # intentionally split into one argument per keychain
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')

          for bin in cal callimachus-mcp; do
            f="$STAGE/$bin-$TRIPLE"
            codesign --force --options runtime --timestamp --keychain "$KEYCHAIN" \
              --sign "$APPLE_SIGNING_IDENTITY" --identifier "dev.shaller.callimachus.$bin" "$f"
            codesign --verify --strict --verbose=2 "$f"
          done

          if [ "$HAS_APPLE_API_KEY" != "true" ]; then
            echo "::warning::APPLE_API_KEY is not set: the standalone macOS binaries are signed but not notarized"
            exit 0
          fi
          NOTARIZE_DIR="$RUNNER_TEMP/notarize"
          ZIP="$RUNNER_TEMP/cli-bins-notarize.zip"
          mkdir -p "$NOTARIZE_DIR"
          cp "$STAGE/cal-$TRIPLE" "$STAGE/callimachus-mcp-$TRIPLE" "$NOTARIZE_DIR/"
          ditto -c -k --keepParent "$NOTARIZE_DIR" "$ZIP"
          RESULT="$(xcrun notarytool submit "$ZIP" --key "$APPLE_API_KEY_PATH" --key-id "$APPLE_API_KEY" \
            --issuer "$APPLE_API_ISSUER" --wait --timeout 30m --output-format json)"
          echo "$RESULT"
          if [ "$(echo "$RESULT" | jq -r '.status')" != "Accepted" ]; then
            ID="$(echo "$RESULT" | jq -r '.id // empty')"
            [ -n "$ID" ] && xcrun notarytool log "$ID" --key "$APPLE_API_KEY_PATH" \
              --key-id "$APPLE_API_KEY" --issuer "$APPLE_API_ISSUER" || true
            echo "::error::Notarization of the standalone macOS binaries was not accepted"
            exit 1
          fi

      - name: Upload standalone bins
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber \
            "$STAGE/cal-$TRIPLE$EXT" \
            "$STAGE/callimachus-mcp-$TRIPLE$EXT"

  # Runs only when every platform leg succeeded. Verifies the draft is complete,
  # adds SHA256SUMS for the standalone binaries (the npm wrapper verifies downloads
  # against it), then publishes the release. A failed leg leaves the draft
  # unpublished: fix and re-run, nothing half-done is ever public.
  #
  # On a re-run of an already-published tag the legs were skipped on purpose, so
  # this job still runs (the explicit `if:`), but only checks that SHA256SUMS and
  # latest.json are there: it never rewrites them or touches "Latest".
  finalize:
    name: Verify + publish release
    needs: [create-release, release]
    if: >-
      !cancelled() && needs.create-release.result == 'success' &&
      (needs.release.result == 'success' ||
       (needs.release.result == 'skipped' && needs.create-release.outputs.published == 'true'))
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      PRERELEASE: ${{ contains(inputs.tag || github.ref_name, '-rc') || contains(inputs.tag || github.ref_name, '-beta') }}
      PUBLISHED: ${{ needs.create-release.outputs.published }}
    steps:
      - name: Already published? Check SHA256SUMS is attached, change nothing
        if: env.PUBLISHED == 'true'
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --clobber -p SHA256SUMS
          [ -s SHA256SUMS ] || { echo "::error::Published release $TAG has no SHA256SUMS"; exit 1; }
          echo "$TAG is already published; leaving its assets and SHA256SUMS as they are"

      - name: Check standalone binaries + write SHA256SUMS
        if: env.PUBLISHED != 'true'
        run: |
          set -euo pipefail
          EXPECTED=(
            cal-aarch64-apple-darwin
            callimachus-mcp-aarch64-apple-darwin
            cal-x86_64-unknown-linux-gnu
            callimachus-mcp-x86_64-unknown-linux-gnu
            cal-x86_64-pc-windows-msvc.exe
            callimachus-mcp-x86_64-pc-windows-msvc.exe
          )
          DIR="$RUNNER_TEMP/release-bins"
          mkdir -p "$DIR"
          cd "$DIR"
          PATTERNS=()
          for f in "${EXPECTED[@]}"; do PATTERNS+=(-p "$f"); done
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --clobber "${PATTERNS[@]}"
          for f in "${EXPECTED[@]}"; do
            if [ ! -s "$f" ]; then
              echo "::error::Release $TAG is missing $f"
              exit 1
            fi
          done
          # Hash the bytes actually attached to the release, not the build outputs.
          sha256sum "${EXPECTED[@]}" > SHA256SUMS
          cat SHA256SUMS
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber SHA256SUMS

      - name: Check the updater manifest covers every platform
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --clobber -p latest.json
          jq -e '.platforms | has("darwin-aarch64") and has("linux-x86_64") and has("windows-x86_64")' latest.json \
            || { echo "::error::latest.json is missing a platform"; jq '.platforms | keys' latest.json; exit 1; }

      - name: Publish the release
        if: env.PUBLISHED != 'true'
        run: |
          set -euo pipefail
          IS_DRAFT="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft')"
          if [ "$IS_DRAFT" != "true" ]; then
            # Published between create-release and now (create-release saw a
            # draft): don't touch "Latest", or an old tag would point the updater
            # back at it.
            echo "$TAG is already published; leaving it as is"
            exit 0
          fi
          if [ "$PRERELEASE" = "true" ]; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease --latest=false
          else
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
          fi
          echo "Published $TAG"

  # Once the release is public, publish the `callimachus-mcp` npm wrapper (it
  # downloads the release binaries at runtime and verifies them against the
  # SHA256SUMS bundled into the package here) and refresh the entry on the
  # official MCP registry. Skipped on prereleases.
  #
  # Auth is GitHub OIDC for both: npm trusted publishing (configure it once on
  # npmjs.com for this repo + build.yml, see RELEASING.md) and the MCP registry.
  # No long-lived NPM_TOKEN. Trusted publishing needs npm >= 11.5.1 / Node 22.14+.
  publish-mcp:
    name: Publish npm wrapper + MCP registry
    needs: finalize
    # The explicit result check (not the implicit success()) keeps this job running
    # on a re-run of a published tag, where the release legs upstream were skipped.
    if: >-
      !cancelled() && needs.finalize.result == 'success' &&
      !contains(inputs.tag || github.ref_name, '-rc') && !contains(inputs.tag || github.ref_name, '-beta')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      MCP_PUBLISHER_VERSION: v1.8.6
      MCP_PUBLISHER_SHA256: 1fbe93fc0783c2394d8012c8d6e50a59e98cb2cc2d216264cc69f405d0e21340
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"
          # Never restore a dependency cache into a publishing job.
          package-manager-cache: false

      - name: Ensure npm supports trusted publishing
        run: |
          npm install -g "npm@^11.5.1"
          npm --version

      - name: Bundle the checksum manifest into the package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          PKG_VERSION="$(node -p "require('./packages/callimachus-mcp/package.json').version")"
          if [ "v$PKG_VERSION" != "$TAG" ]; then
            echo "::error::packages/callimachus-mcp is $PKG_VERSION but the tag is $TAG"
            exit 1
          fi
          SUMS=packages/callimachus-mcp/lib/SHA256SUMS
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" -p SHA256SUMS -O "$SUMS" --clobber
          for t in aarch64-apple-darwin x86_64-unknown-linux-gnu x86_64-pc-windows-msvc.exe; do
            grep -Eq "^[0-9a-f]{64}  callimachus-mcp-$t\$" "$SUMS" \
              || { echo "::error::SHA256SUMS has no entry for callimachus-mcp-$t"; exit 1; }
          done
          cat "$SUMS"

      - name: Publish wrapper to npm (trusted publishing)
        working-directory: packages/callimachus-mcp
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          # Re-runs are safe: npm refuses to republish a version, so skip it.
          if [ -n "$(npm view "callimachus-mcp@$VERSION" version 2>/dev/null)" ]; then
            echo "callimachus-mcp@$VERSION is already on npm; skipping"
          else
            npm publish --access public
          fi

      - name: Install mcp-publisher (pinned, checksum-verified)
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 -o mcp-publisher.tar.gz \
            "https://github.com/modelcontextprotocol/registry/releases/download/$MCP_PUBLISHER_VERSION/mcp-publisher_linux_amd64.tar.gz"
          echo "$MCP_PUBLISHER_SHA256  mcp-publisher.tar.gz" | sha256sum -c -
          tar xzf mcp-publisher.tar.gz mcp-publisher

      # The registry validates the npm package before accepting the entry, and npm's package
      # document lags a fresh publish behind its CDN (15+ minutes seen on 0.11.1 and 0.11.2,
      # while the per-version endpoint answered within a minute). Wait for the version to be
      # servable, then publish, treating "duplicate version" (a re-run) as done.
      - name: Wait for npm to serve the new version
        working-directory: packages/callimachus-mcp
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          URL="https://registry.npmjs.org/callimachus-mcp/$VERSION"
          for attempt in $(seq 1 60); do
            code="$(curl -s -o /dev/null -w '%{http_code}' -H 'Cache-Control: no-cache' "$URL" || true)"
            if [ "$code" = "200" ]; then
              echo "callimachus-mcp@$VERSION is servable (attempt $attempt)"
              exit 0
            fi
            echo "callimachus-mcp@$VERSION not on the registry yet (HTTP $code), waiting…"
            sleep 20
          done
          echo "::error::callimachus-mcp@$VERSION never became servable on npm (20 min)"
          exit 1

      - name: Publish to MCP registry (GitHub OIDC)
        run: |
          set -euo pipefail
          ./mcp-publisher login github-oidc
          for attempt in 1 2 3 4 5; do
            if out="$(./mcp-publisher publish 2>&1)"; then
              echo "$out"
              exit 0
            fi
            echo "$out"
            if grep -q "duplicate version" <<<"$out"; then
              echo "This version is already in the registry; nothing to do."
              exit 0
            fi
            if ! grep -q "was not found" <<<"$out"; then
              exit 1
            fi
            echo "The registry still can't see the npm version; retrying in 60 s (attempt $attempt of 5)…"
            sleep 60
          done
          exit 1
