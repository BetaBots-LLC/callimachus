name: Docker

# Builds the MCP-server image (the Dockerfile MCP registries such as Glama use
# to verify the server) and checks it answers initialize + tools/list over
# stdio. Runs when the image's inputs change, plus weekly to catch base-image
# drift.

on:
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - apps/desktop/src-tauri/Cargo.toml
      - apps/desktop/src-tauri/Cargo.lock
      - .github/workflows/docker.yml
  push:
    branches: [main]
    paths:
      - Dockerfile
      - .dockerignore
      - apps/desktop/src-tauri/Cargo.toml
      - apps/desktop/src-tauri/Cargo.lock
      - .github/workflows/docker.yml
  schedule:
    - cron: "41 5 * * 1" # Mondays 05:41 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Build image
        run: docker build -t callimachus-mcp .

      - name: Smoke test (initialize + tools/list over stdio)
        run: |
          set -euo pipefail
          # Keep stdin open briefly after the requests so the server can answer
          # before it sees EOF and exits.
          {
            echo '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}'
            echo '{"jsonrpc":"2.0","method":"notifications/initialized"}'
            echo '{"jsonrpc":"2.0","id":2,"method":"tools/list"}'
            sleep 10
          } | timeout 120 docker run -i --rm callimachus-mcp > responses.jsonl || true
          cat responses.jsonl
          COUNT="$(jq -s '[.[] | select(.id == 2) | .result.tools | length] | first // 0' responses.jsonl)"
          echo "tools/list returned $COUNT tools"
          if [ "$COUNT" -lt 1 ]; then
            echo "::error::callimachus-mcp did not answer tools/list"
            exit 1
          fi
