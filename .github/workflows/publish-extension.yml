name: Publish Extension

# Runs on the SAME vX.Y.Z tag as the desktop build (one tag drives both; the
# extension version mirrors the desktop version). Packages the VS Code / Cursor
# extension, publishes it to the VS Code Marketplace and Open VSX (where Cursor &
# VSCodium install from), and attaches the .vsix to the SAME GitHub Release as the
# desktop installers. Marketplace publish is skipped when its token is absent.
#
# This workflow never creates or publishes the GitHub Release: build.yml opens it
# as a draft and publishes it only once every desktop asset and the updater
# manifest are uploaded. (Creating it here used to make an empty release go live
# as "Latest" about 17 minutes before latest.json existed.)

on:
  push:
    tags: ["v[0-9]*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to publish the extension for (e.g. v0.4.1)"
        required: true

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    # Skip on RC/beta tags: the Marketplace doesn't accept prerelease versions
    # (e.g. 0.4.1-rc.1), and there's no prerelease channel for the extension.
    if: ${{ !contains(inputs.tag || github.ref_name, '-rc') && !contains(inputs.tag || github.ref_name, '-beta') }}
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ env.TAG }}

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Package extension (.vsix)
        working-directory: apps/vscode
        run: pnpm run package

      - name: Publish to VS Code Marketplace
        if: env.VSCE_PAT != ''
        working-directory: apps/vscode
        run: pnpm exec vsce publish --packagePath callimachus-vscode.vsix -p "$VSCE_PAT"

      - name: Publish to Open VSX (Cursor / VSCodium)
        if: env.OVSX_PAT != ''
        working-directory: apps/vscode
        run: |
          # Namespace must exist before the first publish; no-op if already created.
          pnpm exec ovsx create-namespace BetaBotsLLC -p "$OVSX_PAT" || true
          pnpm exec ovsx publish callimachus-vscode.vsix -p "$OVSX_PAT"

      # build.yml's create-release job opens the draft within a minute or two of
      # the tag push. Wait for it (draft or published), then attach the .vsix.
      - name: Attach .vsix to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              gh release upload "$TAG" apps/vscode/callimachus-vscode.vsix \
                --repo "$GITHUB_REPOSITORY" --clobber
              echo "Attached callimachus-vscode.vsix to $TAG"
              exit 0
            fi
            echo "No release for $TAG yet (attempt $attempt/60); waiting for build.yml..."
            sleep 30
          done
          echo "::error::No GitHub Release for $TAG after 30 minutes. Is build.yml running? Attach the .vsix by hand or re-run this workflow."
          exit 1
