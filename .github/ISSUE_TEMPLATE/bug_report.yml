name: Bug report
description: Something isn't working
title: "bug: "
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected
      description: What you expected instead.
  - type: textarea
    id: repro
    attributes:
      label: Repro steps
      value: |
        1.
        2.
        3.
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS
        - Windows
        - Linux
    validations:
      required: true
  - type: input
    id: os-version
    attributes:
      label: OS version
      placeholder: macOS 26.1, Windows 11 24H2, Ubuntu 24.04
  - type: dropdown
    id: surface
    attributes:
      label: Where it happens
      multiple: true
      options:
        - Desktop app
        - cal CLI
        - MCP server (in an agent)
        - Memory hooks (session start, recall)
        - Claude Code plugin
        - Cursor plugin
        - VS Code / Cursor extension
        - Website
    validations:
      required: true
  - type: input
    id: sources
    attributes:
      label: Agent(s) involved
      placeholder: Claude Code, Codex, Cursor, ...
  - type: textarea
    id: doctor
    attributes:
      label: cal doctor output
      description: >
        Run `cal doctor` (or in the app, Settings > General > Copy diagnostics) and paste the
        result. It is read-only, shows your home folder as ~, and holds no project text or
        prompts. Without `cal`, the app's Copy diagnostics gives the same report.
      render: text
  - type: textarea
    id: logs
    attributes:
      label: Logs / screenshots
      description: >
        Anything else that helps, such as callimachus.log from the app data folder. Please
        redact API keys and private paths.
