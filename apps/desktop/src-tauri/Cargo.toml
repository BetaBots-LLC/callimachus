[package]
name = "callimachus"
version = "0.12.3"
description = "Local index & search for AI agent threads"
authors = ["Ari Shaller"]
license = "AGPL-3.0-or-later"
edition = "2021"
# `tauri dev` runs a bare `cargo run`, which would otherwise have three default members' bins
# to choose from (see `[workspace]`).
default-run = "callimachus"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "callimachus_lib"
# rlib only: the app bin and the standalone bins link it. The Tauri template's
# "staticlib" (iOS) and "cdylib" (Android) are mobile-only outputs; building them cost about
# 20 s per release build plus about 1 GB of debug artifacts. Add them back, next to the
# `cfg_attr(mobile, tauri::mobile_entry_point)` on `run()`, if a mobile target ever ships.
crate-type = ["rlib"]

# The app crate has exactly one bin (src/main.rs), because `tauri build` bundles every bin of
# this package. Three crates: `core` (callimachus-core, everything without Tauri), this app
# crate (the window, tray, Tauri commands and telemetry), and `standalone` (the `cal` and
# `callimachus-mcp` downloads, `cargo build --release -p callimachus-standalone`, which link
# core only, so they build without GTK or WebKit). All three are default members, so a plain
# `cargo test` or `cargo clippy` here covers every crate (most tests live in core). `tauri dev`
# still runs the app (`default-run`), and `tauri build` (`cargo build --bins`) also compiles
# the standalone bins, which the release job built just before, but bundles only this
# package's bin.
[workspace]
members = ["core", "standalone"]
default-members = [".", "core", "standalone"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Everything Tauri-free (index, search, memory, integrations, cal, the MCP server, the jobs).
callimachus-core = { path = "core" }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
# native-tls (OS TLS), NOT rustls: rustls pulls aws-lc-sys/ring, which need libclang_rt.osx.a
# at link time — absent in recent macos-latest Xcodes. native-tls keeps CI on macos-latest.
tauri-plugin-updater = { version = "2", default-features = false, features = ["native-tls", "zip"] }
tauri-plugin-process = "2"
# What lib.rs and telemetry.rs use directly; the version pins and their reasons live in
# core/Cargo.toml, and these resolve to the same copies.
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
rusqlite = { version = "0.40", features = ["bundled", "functions"] }
rusqlite_migration = "2.6"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
thiserror = "2"
# "sync" + "time": telemetry.rs uses tokio::sync::{mpsc, oneshot} and tokio::time directly, so
# name them here instead of relying on tauri/reqwest happening to enable them.
tokio = { version = "1.52.3", features = ["rt", "macros", "rt-multi-thread", "io-std", "process", "sync", "time"] }
# Telemetry's PostHog client; native-tls for the reason in core/Cargo.toml.
reqwest = { version = "0.13.4", default-features = false, features = ["json", "stream", "native-tls", "charset", "http2", "system-proxy"] }
genai = { version = "0.7.2", default-features = false, features = ["native-tls", "system-proxy"] }
tokio-util = "0.7.18"
# Random anonymous install id for opt-in analytics (telemetry.rs). Already in the lock graph.
uuid = { version = "1", features = ["v4"] }
dirs = "7"

[profile.release]
# Smaller, faster release binaries (the app, `cal` and `callimachus-mcp`) at the cost of longer
# release builds. CI's clippy/test jobs use the dev profile and are unaffected.
lto = "thin"
codegen-units = 1
opt-level = 3
strip = true
# panic stays "unwind" on purpose: tokio isolates a panicking task (Tauri async commands, rmcp tool
# handlers, background indexing) by unwinding, so "abort" would turn one bad request into an app crash.
